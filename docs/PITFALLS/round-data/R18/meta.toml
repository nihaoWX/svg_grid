id = "R18"
verdict = "新领土"

family     = [
  "安装要装两个二进制：`svg_grid` + `svg_grid_convert`，而后者只是前者的一个流水线步骤 —— 用户在 PATH 里要维护两个名字",
  "两个二进制各自是副本 ⇒ 「新的 svg_grid + 旧的 svg_grid_convert」这类版本漂移不会报错，只会静静给出旧的转换结果",
  "`doctor` 依赖外部 `svg_grid_convert`：同目录/PATH 找不到就退 3，装机版少了它默认回归入口就废了（R17b 修过一次症状，根因是这一步本不该跨进程）",
]

