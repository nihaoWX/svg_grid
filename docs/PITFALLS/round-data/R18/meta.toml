  { finding = "R18-F2", tier = "代码" },   # doctor 改为进程内调用 convert 库；删掉「找外部二进制 / exit 3」整套
  { finding = "R18-F3", tier = "代码" },   # install.sh 只装一个二进制，并清掉旧装留下的 svg_grid_convert
