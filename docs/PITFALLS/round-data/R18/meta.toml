#   R17 —— doctor 的 `convert:` 行现在说明「进程内」，不再是某个可执行文件路径。
touched    = ["R15", "R17"]

note = """
为什么认定同类：三条都属「交付面/依赖面」的问题 —— 多一个二进制（升级时两个副本各自漂移）/ 多一次跨进程
  （doctor 找不到就废）/ 多一个必须在 PATH 里维护的名字。同族于 R14（编译期路径把构建环境烧进二进制）：
  都是「运行时依赖了一个不该依赖的外部事实」。
根因与修法：已证。① `convert/` 仍是独立 crate（结构清楚），但被主 crate 当**库依赖**用；
  `src/cli/convert.rs` 只是「解析 → 调库 → 映射退出码」的薄壳；② `doctor` 的第一段改成进程内调用；
  ③ `install.sh` 只装 `svg_grid`，并把旧装留下的 `svg_grid_convert` 从 `<prefix>` 里清掉（报告里说一句，不静默）。
证据（本机实测）：
  · 装机 `~/.local/bin` 里**只有** `svg_grid`；`command -v svg_grid_convert` 找不到。
  · `svg_grid convert` 与旧 `convert/target/debug/svg_grid_convert` 在 58 张语料 × 4 种模式
    （--output/--check/--report/--force）+ 13 例错误面/幂等/半成品/不兼容分支上**产物逐字节相同**。
  · 装机版 `doctor`（cwd=/tmp、干净环境）全量 **57 pass / 0 fail / 1 skip**；
    `PATH` 只含 `~/.local/bin` 或只含一个空目录时仍 rc=0（第一段是库调用）。
  · 语料目录不存在时仍退出 3（配置错这一档没被抹平）。
已知遗留（下一轮处理，不在本轮放宽）：convert 库的 stderr 前缀仍硬编码 `svg_grid_convert:`——
  作为子命令调用时那个名字已不存在，应改成随调用方传（`svg_grid convert:`）；本轮为保证与旧二进制
  **逐字节等价**而未动它，已在 PROGRESS 的 Known Issues 里记下。
"""
