  "P1：<use> 的 href/xlink:href 早就是引用（R46 的 referenced_ids 已解析，u4 的按策略克隆因此已生效），但它引用的目标若不是 pattern/marker/mask/filter/渐变/clipPath 这七种“定义”，就永远拿不到 Slot：DefsPlan::slot_of 先按 is_definition 过滤，于是 <defs><rect id=r>/<defs><g id=g> 被引用时 refs[r] 里的策略无处落地，定义子树里的 <use x/y> 也从未按引用者策略缩。修法：slot_of 增加 reference_only（写在 <defs> 里或某个定义 body 里），collect 增加 in_defs 并把 owner/bodies 的登记放宽到“reference_only 且带 id”的一切元素；walk::transform_element 增加 in_defs 参数，用同一个 reference_only 查询 slot。定义子树内的 <use> 因此和叶子图元一样按引用的域缩放。",
