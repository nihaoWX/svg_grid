口径：
  1) <use> 的目标分两类：写在 <defs>（或某个定义 body）里 ⇒ 只被引用渲染，按引用者
     的域缩；写在可绘制树里 ⇒ 既是原位内容又是被引用内容，本轮不动（u7 登记）。
     reference_only 的判据是“在 <defs> 里 或 在定义 body 里”，与元素 tag 无关，
     所以 <rect id=r> 与 <g id=g> 都能拿到 slot。
  2) 域仍然只有 UserSpace(policy) 与 Verbatim。symbol 有合法 viewBox ⇒ Verbatim
     （<use> 的 width/height 已把 viewBox 映射到实例）；无 viewBox 的 symbol 没有
     映射，仍随引用者策略。
  3) Verbatim 的“普通元素”（非七种定义）不 return，而是以 None 继续走一遍 rewrite：
     数值上是 no-op，字节上与 R64 之前相同（<rect> 会 materialise x=0 y=0）。
     这是两条对照（u6/u15）逐字节不变的原因。
  4) 克隆仍由 R46 的 wanted/names 决定：同一目标被 xy 与 y 同时引用 ⇒ 两份副本
     r 与 r--svg-grid-y，各自按自己的域缩（u4）；两个 <use> 同域 ⇒ 共用一份（u17）。
  5) B 选 fail-closed 而不是登记，理由：convert 的契约是“产品会被 plot-grid 原样搬运”，
     foreignObject 的内容这里根本不渲染、switch 的条件这里无法评估，两者都会让
     产物与浏览器画面不一致；语料 0 命中，fail-closed 的代价是 0 个既有产物变化。
  6) C（obb clipPath 里的 pattern）只登记：见 family 第 4 条与 test.py 末尾的复现记录。

旧证据说明：本轮按目录逐个跑 R3..R63 的 test.py（R19 已 retire 不在口径），
结果见提交说明；R19 与 R57 的计数门禁已在本轮同步改成 711 = 419 + 59 + 233。
