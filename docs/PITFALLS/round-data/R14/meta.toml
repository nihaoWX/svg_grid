# R14 的 round-data —— CLI 缺陷批次：零值 panic / 越界 assert / 错误拍平 / 坏 `--help` / 编译期字体路径
#
# 每个字段的唯一来源是本骨架；这里只填本轮的值。
id = "R14"
verdict    = "缺陷"

family     = [
  "用户输入变成 panic（rc=101）",
  "错误被拍平成一串 String，退出码不分档",
  "帮助文本坏掉（-h/--help 被当成取值的 flag）",
  "编译期绝对路径烧进二进制（字体目录）",
]

# 档位：规则 | 检查 | 默认 | 代码 | wontfix。六族都用"检查"（本轮的可跑证据）。
closures   = [
  { finding = "R14-F1", tier = "检查" },   # --ncol/--nrow 0 ⇒ 2（校验提前，不再 div_ceil(0)）
  { finding = "R14-F2", tier = "检查" },   # --avif-quality 越界 ⇒ 2（解析期校验；不再拿用户输入做 assert!）
  { finding = "R14-F3", tier = "检查" },   # 有类型错误 + 退出码分档 0/1/2/3
  { finding = "R14-F4", tier = "检查" },   # --help/-h/--version ⇒ stdout + 0；未知 flag/缺 --output ⇒ 2
  { finding = "R14-F5", tier = "代码" },   # 解析器搬进 src/cli.rs + 单测（不依赖 cwd）
  { finding = "R14-F6", tier = "检查" },   # 字体目录运行时解析：--font-dir > $SVG_GRID_FONT_DIR > 数据根
  { finding = "R14-F7", tier = "检查" },   # 体积债：src/transform.rs 拆成 src/transform/{mod,lengths,primitives,paths}.rs
]

# 本轮改的位置都在 CLI/字体/布局上 ⇒ 动手前先跑这些旧轮的证据（全绿才动）。
run_before = ["R4", "R5", "R6", "R7", "R8", "R9", "R10", "R11", "R13"]

# 本轮**有意**改写了哪些旧轮的断言期望（原因见 note；`record` 由用户做）。
touched    = ["R13", "R9"]

