口径不变：属性路径一字未动；控制字符与非法码位在文本路径仍放行（与属性路径一致）；
CDATA 走 Event::CData，不解实体（`<![CDATA[37&#176;C]]>` 产物与修前逐字节相同）。
遗留（未修，非本轮授权）：文本路径对 `&#1;`/`&#xFFFE;` 仍放行；要加严须两条路径一起改。
