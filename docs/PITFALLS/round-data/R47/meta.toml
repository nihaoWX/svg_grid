根因（已证）：quick-xml 的 BytesText 把引用拆成 Event::GeneralRef（不含 & 与 ;），
两处 DOM 用自写的 resolve_reference 只查五张表；属性路径走 decode_and_unescape_value，
用的正是 quick_xml::escape::unescape —— 两条路径从源头分叉。
修法：两处 GeneralRef 分支都改调 quick_xml::escape::unescape(&format!("&{reference};"))，
Err 走各自已有的 Xml 变体（Display 前缀不变、rc=1），删掉两份 resolve_reference。
