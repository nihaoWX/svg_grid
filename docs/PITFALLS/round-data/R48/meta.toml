note = """
根因（已证）：`collect_letters` 只遍历 marker 的直接 `Node::Text` 子节点，
`Node::Element(_) => None` 把 tspan / `<g>` 包装整棵丢掉；空串时连 marker 一起丢。
查重键是原始字符串，没有和显式 `--labels` 路径共用规范化；`collisions` 用线性 find 分组；
`LetterSite.cell` 在构造时直接抄了 `input`；`describe_duplicate_panel_letters` 在
`MAX_ERROR_BODY` 压力下退化成裸字母，且 fix 文案指向不可执行的 `--labels`。
修法：`walk_letters` / `collect_text` 按文档顺序递归拼接子树文本（实体已在 R47 的 DOM
解析阶段解码，本轮不再解）；`enter` 按 SVG 语义跳过不渲染子树（`NON_RENDERED` 12 标签、
`display:none` 不可被后代覆盖、`visibility:hidden` 可被后代 `visible` 覆盖、`opacity:0`
按祖先继承）；`normalize_label`（trim + 内部空白折叠）同时用于继承字母与显式 `--labels`；
`HashMap<&str, usize>` 分组 O(n)；`LetterSite.cell: Option<usize>` 记录 marker 的
`data-svg-grid-label` 值（显式标签记槽位）；`fit_within` + 逐站点折叠，放不下时用
「前 N 个 + 其余 M 个」明确计数；fix 文案改为「去掉输入自带的 marker，或让每个字母只出现一次」。
口径决定：P6「spacer 字母不渲染」前提为假 —— `--input none` 槽位上的显式 `--labels`
确实渲染（d1render 25 px、cairosvg 94 px；`[ab, none] --labels ,A` 右半 ink 328），
故 spacer 的显式字母仍参与查重，不按 P6 改。378 对语料组合修前 227 对被拒、修后仍 227 对，
集合完全相同：该语料没有 tspan / 不可见 marker，227 对全是真重号；误伤面的修复由五种
不可见形态的端到端用例与证据 C 段覆盖，不以语料对数下降作为判据。
R19 是既有失效（写死 190 用例，8 条红），照实记为 pre-existing，未改其期望值。
"""

