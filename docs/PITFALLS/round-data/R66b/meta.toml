note = """
为什么认定同类：R66 给 W6 加 `paints()` 门时把「上色层」判在了外层元素上，`<text>`/`<pattern>` 都是
「自己不上色、内容在别处」的容器；两条漏判（tspan、href）与五条误判（tile 子元素）根因同一条。
根因已证：d1render 与 cairosvg 四列对拍，27 个用例里修后 W6 与 d1 墨逐条一致（`tspan opacity` 一例
按 resvg 走，cairosvg 分歧已登记）。
怎么修才不弄坏前面：pattern 判据直接复用 `walk::subtree_inks`（同一次 walk），文本判据抽成
`text::text_paints` 并由 `shapes::own_box` 调用，两者都不新增第二套 paint 折叠逻辑。
要跑：R66（W6 假阳性面）、R67（非有限值门）、R19/R57/R64b（用例数快照）、R65（门禁自测）——全绿。
旧证据扫描（best-effort，收尾后停）：R3–R25 逐轮 rc=0；R26–R67 未跑。R57/R64b/R65/R66/R67 单独跑过，全 rc=0。
布局单元测试整体搬到 `src/layout_tests.rs`（由 `src/lib.rs` 声明）：`src/layout.rs` 加门后 24266 B，
R8 的 20 KB 体积门会红；这是移动不是删除（R62 有同样先例），用例数不变。
"""

