family     = [
  "用户裁决：「一旦使用这个 skill，agent 就会忽略那些分析原本的出图功能转而自己从 0 搭建图……现在的改法就是：**优先用对应分析包的原生出图功能，在此基础上做视觉优化**，我只是想避免 agent 自己再造轮子」。这份 skill 通篇只讲「怎么组」（画布/字母/字号/配色/图例/命名/图注），**默认面板已经在磁盘上**——于是 agent 得到的行为是「没有面板 ⇒ 自己画一个」，而不是「用产生这个结果的那个包去出图」。典型：单细胞 UMAP（`sc.pl.umap` / `Seurat::DimPlot` 就在手边，却自己拉坐标、自己散点、自己配色）。",
