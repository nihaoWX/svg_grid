note = """
为什么认定同类：三条是同一件事的三个面 —— ① agent 只在表里找函数（行为）；② 表外一律自绘（成因：没有查证动作）；
  ③ 静态清单永远覆盖不到"这个包/这个版本/tools/ 里这个条目"（结构）。R20 把"原生优先"立成主干第一步，
  但仍以表为中心；本轮把第一步换成**流程**，表降为 §2 的快捷答案。同族于 R20/R17：能力齐、入口缺。
根因与修法：已证。①–⑤（报告要求）逐条落地，证据在本目录 `test.py` 的六族里。
  · ① `references/00_native_plots.md`（9 728 B → 11 288 B ≤ 12 288 B）：**新增 §0「查证流程（本表不是上限）」并置顶**
    （第一个 `##` 就是它），开头硬话「本表不是上限……禁止以『表里没写』为由自绘」；四步有序、每步给可直接跑的命令：
    ① 认包（`grep -rnE "library\\(|^import |^from .* import" <step>/figure_scripts/ | sort -u`，证据=对象类型
    `AnnData`/`Seurat`/`DGEList`/`GRanges`/`SingleCellExperiment`）② 查本仓 `tools/`（`ls tools/`、
    `grep -ril "<包名或工具名>" tools/*/ tools/*/*/ --include=SKILL.md --include=*.md`，命中记下路径）
    ③ 查官方资料（本地自省 > 官方仓库/文档/tutorial/API，不采纳博客/转载/二手；`dir(sc.pl)`、
    `getNamespaceExports("Seurat")`）④ 确认没有才自绘（通用绘图库**图层**，不手搓坐标与图元）。
    §0 末尾给留痕格式 `# native: <包>::<函数>` 与 `# native: none — 查了 tools/<xx>（…）、官方 <版本或链接>（…）；
    结论：…`，并明写 **`none` 必须带两处查证痕迹（`tools/` + 官方资料），只写「没有」不算**。
    §1 的旧「判据三问」**整段删掉**、改写为指向 §0 的四步（不留两套并列判据）。
    为守 12 KB **等量删**：§2 各小节的重复说明（"切片类图的坐标系…"压成一句、§2.6 与 §3 的散文压掉重复的
    "不要手搓"论证、§5 与 §6 的注释句收紧）——**函数名一条没删**（95 条 → 95 条，R20 ② 的实测/静态清单断言照旧全绿）。
  · ② `SKILL.md`（16 242 B → 16 770 B，仍 ≤ 20 KB）：`## ① 确认 panel 来源（原生出图优先）` 的判据段换成
    **四条短句**（**认包** / **查本仓 `tools/`** / **查官方资料** / **确认无才自绘**，顺序不可颠倒），
    两条命令示例**穿插**在该步内（`grep -ril … tools/*/ …` 在第二条、`python -c "…dir(sc.pl)…"` 在第三条），
    并加一句「那里的表只是快捷答案，表里没有就按流程查，不许以『表里没写』为由自绘」；
    留痕硬规则改成「`# native: none — <查证痕迹>`，痕迹必须含两处」。
    主干第 1 条的行为口径改成「先查一轮官方资料：认包 → 查本仓 `tools/` → 查官方 docs/API → 确认无才自绘」
    ——**步骤名 `确认 panel 来源（原生出图优先）` 一字未动**，故 R20 ①「5 步名与 5 个 `##` 章节名逐字一致」照旧全绿。
    一处**踩到的坑（记下来免得后人再踩）**：第一步里若用 `1. **认包**` 这种有序列表，R20 的解析器
    （`^\\d+\\.\\s+\\*\\*(.+?)\\*\\*`，扫的是 `# CORE WORKFLOW` 到下一个 `# ` 之间的整块，`##` 章节也在块内）
    会把四条当成主干步骤 ⇒ 主干变 9 步。改用 `- **认包** —` 无序列表即可（顺序由文中位置表达），
    R21 ② 用同一套解析比对，因此这条退化会被立刻抓到。
  · ③ `references/05_checklist.md`（7 918 B → 8 199 B）：§A0 第一条判据改成「`# native: none` 的**原因必须含
    两处查证痕迹**：`tools/` 查了什么（无条目 / 命中哪个路径）+ 官方资料查了什么（版本或链接、`dir(...)` 结果），
    然后才是结论」，并加抽查命令 `grep -rn "# native: none" <step>/figure_scripts/`（逐条能**回到那次查询**）。
  · ④ 流程真跑了一遍（不是纸上流程）：`micromamba run -n python-bio python -c "import scanpy as sc; print([n for n in dir(sc.pl) if not n.startswith('_')])"`
    → **55 个符号**，首四项 `['Deprecation', 'DotPlot', 'MatrixPlot', 'StackedViolin']`、末项 `'violin'`；
    `grep -ril "scanpy" tools/*/ tools/*/*/ --include=SKILL.md --include=*.md` → **154 条命中**，首条
    `tools/foundation-models/state/references/docs/10_仓库补充_pyproject与模型配置.md`。
    关键发现：**没有 `tools/scanpy` 专用条目**（154 条命中都是别的模型文档在提它）⇒ 按流程继续第 3 步。
    这两条真实输出（各摘 1 行）已写进 §0 当示例，脚本会断言它们在文中（防止示例被编造/漂移）。
  · ⑤ `rsync -a --delete` 覆盖复制件，`diff -r` 为空（`00` 11 288 B / `SKILL.md` 16 770 B / `05` 8 199 B；
    全部 8 份 md ≤ 20 000 B，最大 `02a` 19 933 B）。R9 的变更叙述词黑名单照旧通过。
  · ⑥ 回归：R10（两副本并轨 + 规范源唯一）与 R20（主干/章节/函数名/体积的全套断言，其 ⑥ 内部再跑 R8/R10/R19，
    R19 → R18 → R4–R17 覆盖完整）。R20 实测约 18 分钟（其中 R19 1 085.8s），故 R21 的 ⑥ 给 R20 一个
    超时阈值 `R21_R20_TIMEOUT`（默认 1 500s）；超时就**只跑 R20 的前五族**（①②③④⑤，跳过它自己的回归链）
    并打印 INFO + 在本 note 里声明——不静默降级。本轮实际用时见下面的「本机实测」。
本机实测（2026-11-05，本目录 `python3 test.py`）：
