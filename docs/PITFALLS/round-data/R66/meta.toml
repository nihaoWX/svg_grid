family = [
  "P1：`ink_bbox` 的 `Ctx` 只有 `stroke_painted`/`stroke_width`，`own_box` 对每个图元无条件加框，所以 `fill=\"none\"`、`fill=\"transparent\"`、`fill-opacity=\"0\"`、`stroke-opacity=\"0\"`、`stroke-width=\"0\"` 的内容照样算墨 ⇒ W6 假阳性。修法：`Ctx` 加 `paint: label_paint::Paint`（复用 text 判据，不写第二份）与 `paints()`；closed 图元要求 `paints()`，`line` 要求 `visible && stroke_paints()`，`image` 要求 `visible`。",
  "P1：`visibility=\"hidden\"/\"collapse\"`（属性或 style）完全没进判据 ⇒ 隐藏内容算墨。实测 d1render：`collapse` 按 hidden 处理（cairosvg 2.9.1 当可见，跟 d1/resvg）；后代 `visibility=\"visible\"` 可以恢复。修法：`Ctx.visible` 折叠，`hidden|collapse` ⇒ false、`visible` ⇒ true，其余继承；关键字大小写敏感（`VIS_HIDDEN` 在 d1 里仍然可见）。",
  "P1：`opacity=\"0\"`（元素自身或任意祖先）没进判据 ⇒ 整棵被透明化的子树算墨。`opacity` 与 `visibility` 不同，**不可由后代恢复**：实测 `g opacity=\"0\"` 里的 `rect opacity=\"1\"`、`g opacity=\"0\"` 里的 `visibility=\"visible\"` 后代，d1/cairosvg 都是 0 墨。修法：`Ctx.opaque = ctx.opaque && opacity > 0`，`visit` 在 `inherit_ctx` 之后立刻 `if !ctx.opaque { return; }`（负值按 0 处理，实测 `opacity=\"-1\"` 0 墨）。",
  "P1：`fill=\"url(#id)\"` 的判据必须与 text 同一份：不可解析的 url 不上色（实测 0 墨），`url(#missing) red` 的回退色上色（实测有墨），渐变要至少一个上色的 stop、pattern 要至少一个会上色的子元素。修法：`Paint` 增加 `fill_paints()`/`stroke_paints()`/`stroke_width()`，`any()` = 两者之或；ink 直接用 `Paint::inherit`。",
