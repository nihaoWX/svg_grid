note = """
为什么认定同类：R66 的两处都是「彩排判据与实际是否上色不符」——W6 的墨迹判据只看 stroke，
不看 fill/opacity/visibility（PROGRESS.md 的 Known Issues 早已写「W6 在嵌套输出上是假阳性」）；
`--rel-widths` 把 0 当合法乘数，布局就产出 0 尺寸格子（Known Issues 的「部分为 0 静默产出 0 宽格子」）。
根因已证：`ink_bbox` 与 `label_paint::Paint` 是两份判据，text 用后者、ink 用手写的前者；
`parse_rel_list` 的 `< 0.0` 与 `take_value` 的「负号即旗标」各自漏一种形态。
怎么修才不弄坏前面：ink 与 text 共用 `Paint`（`fill_paints`/`stroke_paints`/`stroke_width`），
`half_stroke()` 的外扩口径、`use` 的 fail-open 占位框、`display:none` 的既有特例全部保留；
`stroke-width=1e-9` 仍然算墨（判据只看非零，不看栅格化结果）。
口径（都按 d1render 实测，cairosvg 2.9.1 在 `visibility`/`collapse`/`opacity` 上与它分叉时以 d1 为准，
与 R58/R59/R61/R62 同一 oracle）：
  fill：`none`/`transparent`/`#rrggbbaa` 零 alpha ⇒ 不上色；`url(#id)` 不可解析 ⇒ 不上色，
        有回退色 ⇒ 按回退色；渐变至少一个上色 stop；pattern 至少一个会上色子元素。
  fill-opacity / stroke-opacity：`<= 0` ⇒ 该 paint 不上色（负值同 0）。
  stroke：`none`/`transparent` ⇒ 不上色；`stroke-width <= 0` ⇒ 不上色；`1e-9` ⇒ 上色（非零）。
  visibility：`hidden`/`collapse` ⇒ 子树不可见，后代 `visible` 可恢复；`display:none` 不可恢复；
        关键字大小写敏感（`VIS_HIDDEN` 在 d1 里可见）。
  opacity：`<= 0` ⇒ 整棵子树不上色，**后代不可恢复**；`0.5`/`0.25` 仍上色。
  `<image>`：没有 fill/stroke，只看 `visible` 与自身 `opacity`。
  `<line>`：fill 无效；`<polyline>`/`<polygon>`/开放 `path`：fill 有效（实测有墨）。
语料差异：214 convert + 58 plot-grid 产物/rc/stderr 全 0 差；W6 文案 6 个语料文件变化，
每个都被证明是 `visibility="hidden"` 贡献被去掉（注入 display="none" 让修前二进制复现修后文案）。
"""

