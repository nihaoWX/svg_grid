note = """
为什么认定同类：R67 的两处 P1 都是「fail-closed 的覆盖面与实际改写面不一致」——R65 的
`finite::unusable` 只按几何表扫，而 composer 的 `rewrite_*` 还会解析 tspan/渐变/pattern/
mask/filter/marker/fe* 的坐标；obb clipPath 的 body 是「分数域」，walk 却按 panel 的
user-space policy 继续改写。两处都不是新语义，而是既有语义漏了入口。
判据选择（A）：采用 **units 门控的类表**，不是「所有数值属性一律拒」。理由：合法的 obb
百分比（`<radialGradient r="50%">`、`<pattern x="50%">`）在 composer 里是合法输入
（`tile_number` 解析失败就静默保留），一律拒会误杀；只有解析后的 units 让 composer 真的
`parse_f32` 时，非数/非有限才必然坏。非有限值在任何 units 下都不是合法 SVG 数，所以
strict 类对 `1e999` 一律拒；pattern 的 `50%` 仍放行。零误拒证据：214 convert + 58 plot-grid
对 base `e0c6033` 逐字节 0 差，5 条合法控制（obb 50%、marker 默认 strokeWidth、feTile
primitiveUnits=obb）全 rc=0。
B 的修法边界：只在 walk 层跳过 obb clipPath 子树，**不**把 clipPath 加进
`domains::body_is_verbatim`。因为 `defs::split` 的 refs 定点会把 body 引用的定义也标成
Verbatim，clip body 里的 userSpace pattern 就不再 8→16 缩放，实测 0/0 会退回 10984/21968/255
（R64 的旧症状）。walk 层跳过不动 defs，pattern 保持 UserSpace slot，两种 paint 都 0/0。
D 的修法边界：`strip_noise` 只清空字面量/注释、保留换行，所以行号与 `#[test]` 定位不变；
`cfg_attr` 分支只匹配 `ignore` 这个词，不误伤 `cfg_attr(test, allow(...))`。
语料差异：214 convert + 58 plot-grid 的 rc/产物字节 0 差；stderr 只在 2 个本来就不兼容的
语料（`tests/fixtures/matplotlib/mathtext.svg`、`tests/mpl_dialect/failclosed_rotated_mathtext.svg`）
上多了 D 的 findings 块，且修后 stderr 以修前 stderr 结尾（只前置、不改旧行）。
"""

