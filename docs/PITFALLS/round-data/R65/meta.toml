family = [
  "P1：`convert --check` 对非有限数判 compatible —— 判据是 `value.trim().parse::<f32>().is_err()`，而 `1e999` 解析成功得 `inf`、`NaN` 解析成功得 `NaN`，所以两者都漏判；写模式 rc=0 且把非法数值原样写进产物（`d` 甚至被展平成 `points=\"inf,NaN 10,10\"`）。修法：新增 `src/convert/finite.rs`，判据改成「解析失败 或 !is_finite()」，并覆盖 circle/ellipse/text/use/line/rect/image 的几何属性、polyline|polygon 的 `points`、`path` 的 `d`（逐 token，命令字母与 Z/z 不误报）、`stroke-width`、`font-size`、`textLength`、`<stop offset>`、fe* 的 stdDeviation/dx/dy/radius/baseFrequency/scale、以及内联 `style` 里的长度 token。",
  "P1：`path` 的 `d` 必须逐 token 判，不能整串 parse：`M 1e999 0 L 10 10` 里只有第一个数是 inf，命令字母必须跳过。新增 `src/convert/path.rs::non_finite_numbers`，复用已有的 `read_number`，遇到畸形文本不报（那是 `tokenize` 的职责，保持既有 `failed to flatten <path d=…>: missing argument for path command 'M'` 文案不变）。",
