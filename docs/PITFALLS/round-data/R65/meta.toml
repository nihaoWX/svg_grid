note = """
为什么认定同类：R63 评审 P2 已写明「convert --check 对非有限值仍判 compatible」；根因是判据只问「能不能 parse」，没问「parse 出来是不是有限数」。
根因与建议修法（已证）：`1e999`/`NaN`/`inf` 都能 parse 成 f32，`is_err()` 因此为假；改成 `!is_finite()` 即闭合，且 `1e-45`/`0`/`-0`/`.5`/`1.`/`+1`/`1E3`/`5px`/`50%` 全部仍合法（实测 16 个合法对照 rc=0 且产物逐字节不变）。
怎么修才不弄坏前面：新门只加在 convert 的 scan 阶段，composer 的 W7 口径（畸形但有限的值保原文）不动；语料 214 个 convert（含 --report）与 58 个 fixture 的 plot-grid（含 --plan）对 base e0c6033 逐字节 0 差。
口径：非有限数 = `inf`/`-inf`/`NaN`（任何拼写）或溢出成 inf 的十进制（`1e999`）；单位后缀 `px`/`%` 先剥再判，`font-size`/`textLength`/`<stop offset>` 只判数字前缀（`40px` 合法）。
"""

