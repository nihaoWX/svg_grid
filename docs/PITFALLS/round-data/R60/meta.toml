note = """
每条先 d1render 实测再写码（表在 test.py 末尾；oracle 与 R58/R59 相同：等向 = 源图按 s 渲染，
各向异性 = 源图内容包进 <g transform="scale(sx sy)"> 在 400x400 画布上渲染）。四列：
修前 xor/md（/tmp/r59_eval/pin = R59 修后）、修后 xor/md（本轮）、oracle、d1 ±cairo。

F1-spot-rms（P1-1，R60-F1，挂 R59-F1/R58-F2）：4x5 下 feSpotLight z/pointsAtZ 是 RMS
sqrt((sx²+sy²)/2) = 43.0116 * 10 / 10 = 45.276928（resvg-0.47.0/src/filter/mod.rs::transform_light_source
的 sz = (sx²+sy²).sqrt()/SQRT_2），不是 Uniform 的几何平均 44.721。修前 37011/206（属性 z=44.721），
修后 0/0（x=80 y=100 z=45.276928 pointsAtX=200 pointsAtY=200）。全精度必要：写成 45.277 会翻 11 像素
（渲染器直接消费 f32），故 LengthAxis::LightZ 用 resvg 同一个算式而不是再四舍五入。
F1-point-rms：fePointLight 的 z 是 R58 继承的同一个 bug，修前 95008/2，修后 0/0。
F2-spot-paz：pointsAtZ=5 同走 LightZ（5*RMS=22.638464），修前 35728/193，修后 0/0。
F3-two-cell（P1-2，R60-F2）：两个 100x80 面板 --width 200 --height 80 --ncol 2 --plot-margin 0，
filter 区域已改写成 0..100/100..200 但光源两格都是 x=20；第二个 cell 修前 5277/238（spot）/7563/248
（point，实测由 R60 的 F3 归并到 spot 一条），修后 0/0，属性 x=120 y=20 pointsAtX=150 pointsAtY=40
（z/pointsAtZ 只缩放不平移）。position 走 map_point（平移+缩放），与 feImage 的 x/y 同一机制；
缺省的光源位置（没有 x= 属性）也按 (target.x-source.x) 补写，否则缺省 0 会留在原处。
F4-obb（P1-3，R60-F3）：primitiveUnits="objectBoundingBox" 下光源仍是 user-space f32
（usvg-0.47.0/src/parser/filter.rs::convert_light_source 不读 primitiveUnits），修前整块改写被跳过
⇒ 100170/242，修后 0/0，属性与 userSpace 完全相同（x=80 y=100 z=45.276928 pointsAtX/Y=200）；
同一个 filter 里的 feGaussianBlur stdDeviation="2" 仍是分数、保持 "2"（真 obb 属性继续门控）。
F5-x-bbox（P2-1，R60-F4）：渲染器把单值 scale 平方（offset=(c-0.5)·scale²·axis），所以重写值取轴因子
的平方根：data-scale="x"、sx=4、原 scale="1" ⇒ 2（黑块左边缘 40→42 精确）；旧代码写 sx*s=4 ⇒ 48
（过位移 4×，xor 5472/255）。两轴无精确解（x 要 sqrt(8)、y 要 sqrt(10)），回退为两个精确值的几何平均
(4*5)^(1/4)=2.115（旧 Uniform 写 4.472，过位移 4.5×）；单轴 y 是 sqrt(5)=2.236。
<b>注意</b>：位移不能用 <g transform> 包源图作 oracle——resvg 在局部分辨率栅格化滤镜再放大，
0.5px 位移被舍掉，参照图不动（假残余 1352）；故 F5 用黑块左边缘（几何已知：10*4=40）作 oracle。
F6-subregion（P2-2，R60-F5）：除光源外每个图元的 x/y/width/height 是 primitiveUnits 长度
（usvg filter.rs::resolve_primitive_region 的 userSpace 分支），修前 stdDeviation 2→4 但盒子不动
⇒ 16984/255；修后 stdDeviation=4 x=20 y=20 width=160 height=120，0/0。
F7-blur/F7-stroke（P2-4，R60-F6）：stdDeviation="1e999" 修前被写成 "inf"（非法 SVG 数值，且 W7 文案说
kept verbatim 而字节变了）；stroke-width="1e999" 从 R50 起同样写成 "inf"（rewrite_scaled_length 同一条路）。
修后一律保原文 + W7，输出里没有 inf/NaN/-inf。
F8（P2-4 第二半）：stdDeviation="" / " " / "2 3 4" 修前静默保留（无 W7）；usvg 的
convert_std_dev_attr 对这几种输入把整个属性忽略（模糊为 0），保原文是对的，但必须报 W7，文案含
"expected one or two numbers"。W7 单条 200 字符上限：detail 里带原因时 "2 3 4" 只剩 172 字，
故文案不再重复 "3 numbers"（那是被截掉的部分）。

