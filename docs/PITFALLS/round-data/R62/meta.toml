口径：
  1) 内容域只区分两种：UserSpace(policy) 与 Verbatim。单域定义永不克隆（否则 220 个
     语料产物会被无意义改写）；克隆是传递的：A 的 body 是 verbatim 时，A 引用的 B
     也收 Verbatim，B 再引用的 C 亦然。
  2) marker 的 verbatim 判据只有 viewBox（markerWidth/Height 仍按面板策略缩，见 m1/n3）。
  3) ellipse 只写一个半径时补写另一个：SVG 规定两者相等，只改一个会得到错误形状
     （命中用例 b2/b3：修前 xor 20656/255，修后 0/0）。半径只写在 inline style 里时
     整对保留（d1render 两种拼写都不画，写属性等于凭空造几何，见 b6 的注册）。
  4) 非数字几何（rx="abc"）在 plot-grid 里 fail-closed（rc=2、不写产物），
     convert --check 也报同一句；此前 ellipse 完全不过这道闸。
  5) 登记不改：obb clipPath 引用 pattern 仍 16000/255；obb mask 引用 pattern 两种拼写
     都 0/0（无判别力）；单坐标梯度、tile 的 x/y 与 width/height、filter-mask 区域
     各自独立——这些是“只重写它写了的东西”的契约，不是缺陷。
  6) 三条可选 P3（非有限 points 双 W7、A3 “1 attribute 保留 2 个”、R61 失败只打印
     err 尾巴）本轮不做：前两条要改 W7 的 offender 模型与文案，会牵动大量证据期望，
     换来的只是诊断措辞；第三条只影响失败时的可读性。均已在 R61/meta.toml 登记。

  7) href 出边的域由定义自己 body 是否被映射决定：user space 里被 url() 引用的定义
     tile 照样缩放，但它 href 的目标要取 verbatim 副本；链式传递，梯度也参与。

