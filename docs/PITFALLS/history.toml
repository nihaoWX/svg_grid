# 阻塞点处理历史账本（history.toml）
#
# 本项目专属的账本：记「每轮改了哪些代码位置、为什么、出自哪份报告、哪个 commit」，
# 供下一个 agent 动手前用下面这条命令反查，以免改坏上一轮刻意建立的行为、或重开已裁决的问题：
#   python3 <本工具>/history.py query <路径>[:<符号>] --history <本文件> --repo <锚点所属仓库>
#
# 硬规则：
#   * 只增不改：写错了就**追加**一条修正 finding，并在它的 related 里挂上旧 id，绝不重写历史。
#   * 键用 <仓库根相对路径>[:<函数/类限定名>]，**不要用行号**（行号会漂移）。
#   * 行号只作为**锚定到某个 commit** 的定位辅助，记进 lines_before / lines_after。
#   * 报告（原件）修完即删；靠 `git -C <仓库> show <commit>:<path>` 随时取回，证据不丢、也不堆旧文件。
#   * `--repo` **必给**（init / record / query 都要）：工具不做任何自动探测，不替你猜仓库。
#
# —— 字段定义（本注释是 schema 的唯一来源）——
#
# [[round]]              —— 一轮修复，一份一条
#   id                   轮次 id，形如 R1 / R2（必填，全局唯一）
#   date                 日期 YYYY-MM-DD（必填）
#   code_before          本轮修改前的 commit（必填，须是真实 commit）
#   code_after           本轮修改后的 commit（可为空串 "" = 尚未提交）
#   summary              一句话概括本轮做了什么（必填）
#
#   [[round.report]]      —— 本轮**消费的全部报告**，一份一条（可能多条）
#     path               报告在仓库根下的相对路径（必填）
#     commit             该路径上**最新、且该 commit 里文件仍存在**的提交（record 自动查，勿手填）
#
#   [[round.finding]]     —— 本轮定位到的每条 finding
#     id                 finding id，全局唯一，形如 R1-F1（必填）
#     report             本 finding 出自哪几份报告，**可为空 []**——复核/追加类 finding 无对应报告时
#                        留空；非空时每个名称须能在同轮 [[round.report]] 里找到（值取上面的 path，
#                        报告名 basename 或仓库根相对路径皆可；同名 basename 命中多份须写全路径）
#     symptom            现象的简短描述，含关键量（必填）
#     status             仅在需要特殊对待时出现：wontfix（已裁决，不得重开）| deferred（记了未修）；
#                        不写 = 已修
#     where              <仓库根相对路径>[:<函数/类限定名>]（必填）
#     lines_before       锚定到 code_before 快照的行区间 "238" 或 "238-247"（可选）
#     lines_after        锚定到 code_after 快照的行区间（可选）
#     reason             为什么这么改 / 为什么 wontfix（必填）
#     related            关联到的旧 finding id 列表（改名 / 补充 / 推翻旧记录），可空
#
# —— 空表说明 ——
# 本账本当前**没有任何 [[round]] 条目**。第一轮用下面这条命令追加（不要手改既有条目）：
#   python3 <本工具>/history.py record --from-json <round.json> --history <本文件> --repo <仓库>

# —— 锚点所属仓库（config，可改）——
# repo  锚点（commit、快照路径）在哪些仓库里解析：**按顺序依次尝试、命中即用**。
#       路径**相对本账本所在目录**（由 init --repo 归一化后写入，账本随目录树整体搬迁后仍成立）。
#       record / query 也要给 --repo，与它**集合不一致 ⇒ 报错**（不静默换仓）。
#       工具**不做任何自动探测**（不向上找 .git、没有默认值）：仓库是调用方本来就知道的事。
#       *项目目录本身是个 git 仓时*（本仓 tools/ 的既定做法：每个工具一个仓），向上取只会取到
#       **最内层**那个，所以本键必须指到锚点真正所在的**外层**仓库。
repo = ["../../../.."]

