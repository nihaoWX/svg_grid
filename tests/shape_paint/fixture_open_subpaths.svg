<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Defect 2: two *open* (no `Z`) overlapping contours in one filled <path>
       (the pdftocairo glyph shape). Concatenating them without explicitly closing
       each subpath makes the bridge edges real edges: they change the winding
       number and erase the fill around (31,29)/(29,31). The two contours wind in
       opposite directions, so the overlap at (50,50) stays a hole (nonzero rule),
       exactly as the source renders it. -->
  <path d="M 20 20 L 60 20 L 60 60 L 20 60 M 40 40 L 40 80 L 80 80 L 80 40" fill="#000000"/>
</svg>
