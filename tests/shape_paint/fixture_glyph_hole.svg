<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Fill-only glyph with a counter, written as ONE <path> with the outer contour
       and the inner counter, both WITHOUT `Z` (the poppler shape). The outer
       contour winds one way and the counter the other, so (nonzero fill-rule) the
       counter must stay empty: the concatenated, explicitly-closed fill <polygon>
       must keep the hole. -->
  <rect x="0" y="0" width="100" height="100" fill="#ffffff"/>
  <path d="M 30 20 L 70 20 L 70 80 L 30 80 M 42 32 L 42 68 L 58 68 L 58 32" fill="#000000"/>
</svg>
