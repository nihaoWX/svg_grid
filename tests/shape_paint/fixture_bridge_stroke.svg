<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Defect 1: two *disjoint* closed rectangles in ONE <path>, carrying both a
       fill and a stroke. The fill region of a filled path is the concatenation of
       all its subpaths; if that <polygon> kept the source `stroke`, the bridge
       segment between the two rectangles (which runs through the gap at (45,45))
       would be stroked. -->
  <path d="M 10 10 L 30 10 L 30 30 L 10 30 Z M 60 60 L 90 60 L 90 90 L 60 90 Z" fill="#ff0000" stroke="#000000" stroke-width="2"/>
</svg>
