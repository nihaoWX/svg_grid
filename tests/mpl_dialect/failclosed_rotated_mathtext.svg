<svg width="100" height="80" viewBox="0 0 100 80" xmlns="http://www.w3.org/2000/svg">
  <!-- matplotlib emits a rotated *mathtext* label as a <g translate(...) rotate(...)>
       ancestor around a <text><tspan ...> tree. That ancestor is NOT a pure
       translation, so the converter must still fail closed (the label cannot be
       baked without a transform on text). -->
  <g transform="translate(10 20) rotate(-90)">
    <text>
      <tspan x="0" y="0" style="font-size: 10px">a</tspan>
      <tspan x="5" y="0" style="font-size: 10px">b</tspan>
    </text>
  </g>
</svg>
