# Fixture manifest for the svg_grid corpus.
#
# Every [[fixture]] is one generated SVG; regenerate the whole set with the
# scripts next to it (ggplot2/gen_*.R, matplotlib/gen_*.py, seaborn/gen_seaborn.py).
# id      = "<package>/<svg basename>"; the file itself is tests/fixtures/<id>.svg
#           (so `id = "ggplot2/violin"` is tests/fixtures/ggplot2/violin.svg)
# package = the plotting package that produced it
# call    = the one-line call this figure exercises
# covers  = the constructs this file really contains (evidence for coverage)
# expect  = "pass" | "unsupported" (then `why` says which construct is not supported)
#
# Registration set: 58 entries <-> 58 files, 1:1, no duplicates, checked 2026-11-04.
# `covers` is evidence, not a contract: it lists the constructs worth naming, so a
# file may contain more than it declares (all 30 ggplot2 files contain a `<defs>`
# for their clipPath, and 25 files use the plain `opacity` property; neither is
# declared everywhere). Read the union as "at least this much", not as exhaustive.
#
# Baseline measurement (2026-11-04). Every entry was run through the real two-stage
# pipeline, no parameter tuning:
#   svg_grid_convert --input <id>.svg --output <tmp>/tagged.svg
#   svg_grid plot-grid --input <tmp>/tagged.svg --output <tmp>/o.svg \
#                      --output-png <tmp>/o.png --png-dpi 300
# Binaries: ~/.local/bin/svg_grid_convert and ~/.local/bin/svg_grid (the in-repo
# target/release/ has svg_grid only — there is no convert build there).
# Result: 55 pass (A), 1 unsupported (B: matplotlib/mathtext), 2 known defects
# (C: ggplot2/gradient_fill, matplotlib/bars_grouped — kept at expect = "pass" on
# purpose so `doctor` keeps reporting them as FAIL; see the per-entry notes).

