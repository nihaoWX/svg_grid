[[fixture]]
id = "matplotlib/mathtext"
package = "matplotlib"
call = "mathtext in title/labels/text ($\\alpha$, $\\sum$, $\\frac$) via <tspan>"
covers = ["<defs>", "<use>", "<g transform>", "rotate()", "<clipPath>", "<path>", "<rect>", "<text>", "<tspan>", "<style> CSS block", "id + xlink:href"]
# Measured 2026-11-04: convert exits 1. The mathtext itself (<text>/<tspan>) is not
# the problem — the rotated y-axis label is: matplotlib wraps it in
# `<g transform="translate(14.370313 87.60418) rotate(-90)">` and a <text> under an
# ancestor with rotation/scale is fail-closed (convert.md §2), because baking it
# would silently change font size and orientation. The refusal is loud and names
# the node, which is exactly what §2 asks for.
expect = "unsupported"
why = "<text> under a rotated ancestor <g transform=\"translate(...) rotate(-90)\"> (matplotlib rotated y-axis label): only a pure translation can be baked into text, so the converter refuses instead of misplacing the label"

