<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <!-- V2 #1 (hand-written): a filled glyph with a hole, exactly the poppler shape:
       ONE <path> holding the outer contour AND the inner counter, both written
       WITHOUT `Z`; referenced by <use>; the fill colour comes from an ancestor <g>.
       Outer contour (30,20)->(70,20)->(70,80)->(30,80) and inner counter
       (42,32)->(42,68)->(58,68)->(58,32) wind in OPPOSITE directions (like a real
       TrueType 'O'/'0'): the hole must stay empty (nonzero fill-rule). -->
  <defs>
    <g id="glyph-0-1">
      <path d="M 30 20 L 70 20 L 70 80 L 30 80 M 42 32 L 42 68 L 58 68 L 58 32"/>
    </g>
  </defs>
  <rect x="0" y="0" width="100" height="100" fill="rgb(100%, 100%, 100%)"/>
  <g fill="rgb(20%, 40%, 80%)">
    <use xlink:href="#glyph-0-1" x="0" y="0"/>
  </g>
</svg>
